name: skillsync_flutter
description: A native mobile application for SkillSync - Professional networking and skill-sharing platform.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.6.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.6
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Optional assets can be added here if needed
    - assets/
