name: SkillSync E2E, Appium Mobile & Load Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-load-and-appium-tests:
    name: Run Selenium E2E, Load Tests & Appium Mobile Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Selenium & Appium Dependencies
        run: |
          cd selenium_tests && npm install
          cd ../appium_tests && npm install

      - name: Run Selenium E2E Suite, Multi-Tab Sync & Load Test
        run: |
          cd selenium_tests
          npm run all

      - name: Run Appium Mobile E2E Test Suite
        run: |
          cd appium_tests
          npm run all

      - name: Upload Excel Test Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillSync_Complete_Testing_Reports
          path: |
            selenium_tests/Load_Performance_300_TestCases_Analysis_Report.xlsx
            selenium_tests/SkillSync_E2E_Test_Report.xlsx
            appium_tests/SkillSync_Appium_Mobile_Test_Report.xlsx
          retention-days: 30
