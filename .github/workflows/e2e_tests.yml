name: SkillSync E2E, Appium Mobile, Load & Security Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  e2e-load-appium-and-security-tests:
    name: Run Selenium E2E, Appium Mobile, Load & Security Audit Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Selenium & Appium Dependencies
        run: |
          cd selenium_tests && npm install
          cd ../appium_tests && npm install

      - name: Run Selenium Web E2E Suite, Load Benchmarks & Security Audit
        run: |
          cd selenium_tests
          npm run all

      - name: Run Appium Mobile E2E Test Suite
        run: |
          cd appium_tests
          npm run all

      - name: Upload Excel Audit Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillSync_Complete_Testing_and_Security_Reports
          path: |
            selenium_tests/Load_Performance_300_TestCases_Analysis_Report.xlsx
            selenium_tests/SkillSync_E2E_Test_Report.xlsx
            appium_tests/SkillSync_Appium_Mobile_Test_Report.xlsx
            selenium_tests/SkillSync_Security_Vulnerability_Audit_Report.xlsx
          retention-days: 30

      - name: Publish GitHub Deployment Status
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'SkillSync Production Web App Deployment',
              required_contexts: [],
              auto_merge: false
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://skillsync-app-rho.vercel.app',
              log_url: 'https://skillsync-app-rho.vercel.app',
              description: 'Deployment is live on Vercel'
            });

